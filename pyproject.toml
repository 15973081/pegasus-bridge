[project]
name = "pegasus-bridge"
version = "0.2.0"
description = "Windows PegasusEditor CLI and MCP adapter with backed-up UI template updates"
readme = "README.md"
authors = [
    { name = "15973081", email = "114197574+15973081@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "pywin32>=308 ; sys_platform == 'win32'",
]

[project.scripts]
pegasus-bridge = "pegasus_bridge:main"
pegasus = "pegasus_bridge:main"
pegasus-mcp = "pegasus_bridge.server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
